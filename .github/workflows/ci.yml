name: CI Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build (incluye lint de react-scripts)
        run: npm run build
        env:
          CI: true

      - name: Tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
